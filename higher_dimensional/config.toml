# to give information about the simulations that we are running

[simulation]
input_data = "input_data/nostorage/"
# "input_data/storage/", "input_data/nostorage/"
profiles_type = "DISTANT"
# possibilities: "DISTANT", "CLOSE", "MIXED", "HALFMIXED", "EQUAL"
n_runs = 1

[clustering]
use_ratio = false
heuristic_distance = false
use_apgs = false
perc_initial_clustering = 0.5 # only important if use_apgs = true
beta = 0.0
alpha = 0.0

[extreme_periods]
add_worst_every_hour = false
add_best_every_hour = false # this can be true only if also the previous one is true
add_worst_sum = false
add_worst_sum_real = false


