# to give information about the simulations that we are running

[simulation]
input_data = "input_tables/"
n_runs = 5

[clustering]
heuristic_distance = false
use_apgs = false
perc_initial_clustering = 0.5 # only important if use_apgs = true
beta = 0.0
alpha = 0.0

[extreme_periods]
add_worst_every_hour = false
add_best_every_hour = false # this can be true only if also the previous one is true
add_worst_sum = true
one_for_all_scenarios = false # this can be true only if using cross-scenario

[weights_inter-period]
storage_Dirac = false
max_rp_storage = 0 # 0 is default
